# BASIRAH — GitHub Pages Deployment Workflow

# Frontend-only GitHub Pages deployment. The FastAPI backend is hosted
# externally (Render / Railway / Fly.io) and is not deployed by this
# workflow.

name: BASIRAH — Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'basirah/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment; skip runs queued between the
# in-progress run and the latest queued run.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd basirah
          npm ci --no-audit --no-fund

      - name: Build
        run: |
          cd basirah
          npm run build
        env:
          # Delivery mode is baked at build time by Vite's define plugin
          # (src/hooks/appMode.tsx reads VITE_APP_MODE). GitHub Pages runs
          # in showcase mode, which intentionally makes NO live API calls:
          # analysis falls back to the static sample result (EvidenceResultView).
          VITE_APP_MODE: "showcase"

          # Vite's `base` is a build-time defineConfig field (NOT an env var),
          # so it cannot be set via VITE_* — it must be a plain env var. We do
          # NOT set VITE_API_BASE_URL: in showcase mode there is literally no
          # backend on GitHub Pages, and any /api POST would 405. Showcase UX
          # substitutes the static sample result, so no network analysis path
          # exists to hit. Local development sets VITE_API_BASE_URL in .env.
          BASE_URL_OVERRIDE: "/Aljuri/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: basirah/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
